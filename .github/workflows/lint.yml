name: Lint Code

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    # Also runs on merge so a bad merge cannot land unlinted code.

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to the toolchain declared in go.mod for reproducible builds.
          go-version-file: go.mod
          check-latest: true

      # NOTE: no `go clean -modcache` here. It ran before actions/cache and
      # deleted exactly what the cache was about to restore.
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned, not `latest`: a linter that changes under us turns CI into a
          # non-reproducible gate.
          version: v2.12.2
          # Tests are linted too; excluding them hid real findings in test code.
          args: --timeout=10m ./...
