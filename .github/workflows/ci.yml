name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
    # Runs on every PR to main/master
  push:
    branches: [main, master]
    # Also runs on merge to main/master

jobs:
  test:
    name: Run Unit Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to the toolchain declared in go.mod for reproducible builds.
          go-version-file: go.mod
          check-latest: true

      # go.work binds the modules together, so a change to the core is compiled
      # against every family in the same run.
      - name: Build every module
        run: |
          for m in . aws messaging http database/sql database/redis database/mongodb database/memcached preset/full; do (cd "$m" && go build ./...); done

      - name: Check architectural constraints
        run: make lint-arch

      - name: Report dependency footprint per module
        run: make lint-deps

      - name: Run Tests with Race Detector
        run: make test

      - name: Coverage (core module)
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Check Coverage File
        run: |
          if [ ! -f coverage.out ]; then
            echo "Coverage report not found!"
            exit 1
          fi

      - name: Enforce minimum coverage on critical packages
        run: make coverage-check

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run govulncheck
        run: |
          for m in . aws messaging http database/sql database/redis database/mongodb database/memcached preset/full; do
            echo "==> govulncheck $m"
            (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@latest ./...)
          done
