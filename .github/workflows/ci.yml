name: CI Pipeline

on:
  pull_request:
    branches: [main, master]
    # Runs on every PR to main/master
  push:
    branches: [main, master]
    # Also runs on merge to main/master

env:
  # Pinned, not @latest: a scanner that changes under us turns a release gate
  # into a non-reproducible one, and a new advisory can fail an unrelated PR.
  GOVULNCHECK_VERSION: v1.7.0

jobs:
  test:
    name: Run Unit Tests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Pin to the toolchain declared in go.mod for reproducible builds.
          go-version-file: go.mod
          check-latest: true

      # go.work binds the modules together, so a change to the core is compiled
      # against every family in the same run.
      - name: Build every module
        run: |
          modules=$(./scripts/modules.sh dirs)
          for m in $modules; do (cd "$m" && go mod download && go build ./...); done

      # Fuzz targets are discovered, not listed (D41). On a pull request the
      # base branch is the baseline, so removing a target fails here instead of
      # silently shrinking the fuzz campaign.
      - name: Fetch the base branch for the fuzz baseline
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Check architectural constraints
        env:
          FUZZ_BASELINE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: make catalog-check && make lint-arch && make lint-docs && make check-all-modules

      # Catches a submodule requiring a core version that was never published.
      # Nothing else can: go.work and the replace directives make it build fine
      # in the repo, and it fails only for the first consumer to run `go get`.
      - name: Check module versions resolve for consumers
        run: make check-modules

      - name: Smoke test an external consumer
        run: make smoke

      # The example service is a real consumer of the library. A change that
      # passes every unit test can still make an application impossible to
      # build; this is where that shows up.
      - name: Build and test the example service
        run: make example

      - name: Report dependency footprint per module
        run: make lint-deps

      - name: Run Tests with Race Detector
        run: make test

      - name: Coverage (core module)
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Check Coverage File
        run: |
          if [ ! -f coverage.out ]; then
            echo "Coverage report not found!"
            exit 1
          fi

      - name: Enforce minimum coverage on critical packages
        run: make coverage-check

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.out

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run govulncheck
        run: |
          modules=$(./scripts/modules.sh dirs)
          for m in $modules; do
            echo "==> govulncheck $m"
            (cd "$m" && go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...)
          done
