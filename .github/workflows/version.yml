name: Auto Versioning

on:
  # Automatic minor bump on every merge is disabled: it produced duplicate tags
  # on the same commit (v0.13/v0.14, v0.16/v0.17, v0.19/v0.20) and could not tell
  # breaking changes from fixes. Releases are now cut deliberately by running this
  # workflow manually. See docs/plan-mejoras-go-engine.md (Fase 0).
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        required: true
        default: "minor"
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-version:
    name: Create Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to fetch all tags

      - name: Get latest root tag
        id: get_tag
        run: |
          # Only root-module tags (vX.Y.Z) count. Submodule tags are prefixed
          # with their directory (aws/v0.30.0, database/redis/v0.30.0, ...), and
          # `git describe` would happily return one of those and derive a
          # nonsense next version from it.
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest root tag: $LATEST_TAG"

      - name: Resolve the release version
        id: next_version
        run: |
          # The version comes from what the modules declare, not from bumping
          # the last tag. Those two disagreed: the modules required v0.30.0
          # while this workflow computed v0.21.0 from the newest root tag, so a
          # release would publish a tag no module referenced.
          #
          # scripts/sync-module-versions.sh sets the declared version; this job
          # only publishes it.
          DECLARED=$(grep -hoE 'github\.com/skolldire/go-engine v[0-9]+\.[0-9]+\.[0-9]+' aws/go.mod | head -n1 | awk '{print $2}')

          if [ -z "$DECLARED" ]; then
            echo "::error::no intra-repository version found in aws/go.mod"
            exit 1
          fi

          LATEST="${{ steps.get_tag.outputs.latest_tag }}"
          if [ "$DECLARED" = "$LATEST" ]; then
            echo "::error::modules already declare the released version $LATEST"
            exit 1
          fi

          echo "new_version=$DECLARED" >> $GITHUB_OUTPUT
          echo "Releasing $DECLARED (previous root tag: $LATEST)"

      # A release must publish every module's tag or none of them. Previously
      # the root tag was pushed here and the sub-module tags in a second
      # workflow that this push triggered, so between the two `go get
      # .../aws@vX.Y.Z` failed: the version existed for the root and for nothing
      # else. Consumers hit that window, not us.
      - name: Preflight
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.next_version.outputs.new_version }}"

          # Everything that would make the release unusable is checked before a
          # single tag exists, because a pushed tag is effectively permanent:
          # the module proxy caches it and re-tagging is not a fix.
          make check-modules
          make lint-arch
          make test
          make smoke

          for m in "" aws messaging http database/sql database/redis \
                   database/mongodb database/memcached preset/full; do
            tag="${m:+$m/}$NEW_VERSION"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "::error::tag $tag already exists"
              exit 1
            fi
          done

      - name: Create and push every tag atomically
        run: |
          set -euo pipefail
          NEW_VERSION="${{ steps.next_version.outputs.new_version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TAGS=()
          for m in "" aws messaging http database/sql database/redis \
                   database/mongodb database/memcached preset/full; do
            # Go resolves a sub-module only through a tag prefixed with its
            # directory, so each module needs its own.
            tag="${m:+$m/}$NEW_VERSION"
            git tag -a "$tag" -m "${m:-go-engine} $NEW_VERSION"
            TAGS+=("$tag")
          done

          # --atomic makes the remote accept all of them or none: a partial
          # push is what created the broken window in the first place.
          git push --atomic origin "${TAGS[@]}"
          echo "Published ${#TAGS[@]} tags for $NEW_VERSION"

      # The release is created here, in the same job, rather than by a workflow
      # listening for the tag push. That listener could never fire:
      #
      #   - GitHub does not trigger workflows from events created with the
      #     default GITHUB_TOKEN, to stop workflows looping.
      #   - It also creates no tag events at all when more than three tags are
      #     pushed at once, and a release publishes nine.
      #
      # Either one alone would have been enough to leave every release tagged
      # but never published. Doing it inline removes the cross-workflow event
      # dependency instead of working around it.
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.new_version }}
          name: Release ${{ steps.next_version.outputs.new_version }}
          body: |
            ## Release ${{ steps.next_version.outputs.new_version }}

            Every module is tagged at this version:
            `go-engine`, `aws`, `messaging`, `http`,
            `database/{sql,redis,mongodb,memcached}` and `preset/full`.

            ```bash
            go get github.com/skolldire/go-engine@${{ steps.next_version.outputs.new_version }}
            go get github.com/skolldire/go-engine/aws@${{ steps.next_version.outputs.new_version }}
            ```

            See the commit history and MIGRATION.md for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
