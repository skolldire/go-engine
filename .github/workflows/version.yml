name: Auto Versioning

on:
  # Automatic minor bump on every merge is disabled: it produced duplicate tags
  # on the same commit (v0.13/v0.14, v0.16/v0.17, v0.19/v0.20) and could not tell
  # breaking changes from fixes. Releases are now cut deliberately by running this
  # workflow manually. See docs/plan-mejoras-go-engine.md (Fase 0).
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        required: true
        default: "minor"
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-version:
    name: Create Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to fetch all tags

      - name: Get latest root tag
        id: get_tag
        run: |
          # Only root-module tags (vX.Y.Z) count. Submodule tags are prefixed
          # with their directory (aws/v0.30.0, database/redis/v0.30.0, ...), and
          # `git describe` would happily return one of those and derive a
          # nonsense next version from it.
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest root tag: $LATEST_TAG"

      - name: Calculate next version
        id: next_version
        run: |
          LATEST_TAG="${{ steps.get_tag.outputs.latest_tag }}"
          
          # Remove 'v' prefix if present
          VERSION=${LATEST_TAG#v}
          
          # Normalize version: ensure we have MAJOR.MINOR.PATCH format
          # Handle cases like "1", "1.0", "1.0.0"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Set defaults for missing segments
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # Validate that MAJOR is a number
          if ! [[ "$MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Invalid major version: $MAJOR"
            exit 1
          fi
          if ! [[ "$MINOR" =~ ^[0-9]+$ ]]; then
            MINOR=0
          fi
          if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
            PATCH=0
          fi
          
          # Increment the segment selected when dispatching the workflow.
          case "${{ github.event.inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            patch)
              PATCH=$((PATCH + 1)) ;;
            *)
              MINOR=$((MINOR + 1)); PATCH=0 ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          set -e -o pipefail
          NEW_VERSION="${{ steps.next_version.outputs.new_version }}"
          
          # Verify tag doesn't already exist
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag $NEW_VERSION already exists, skipping..."
            exit 0
          fi
          
          # Create annotated tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          echo "Created tag: $NEW_VERSION"
          
          # Push tag (this will trigger the release workflow)
          git push origin "$NEW_VERSION"
          echo "Successfully pushed tag: $NEW_VERSION"
