name: Auto Versioning

on:
  # Automatic minor bump on every merge is disabled: it produced duplicate tags
  # on the same commit (v0.13/v0.14, v0.16/v0.17, v0.19/v0.20) and could not tell
  # breaking changes from fixes. Releases are now cut deliberately by running this
  # workflow manually. See docs/plan-mejoras-go-engine.md (Fase 0).
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        required: true
        default: "minor"
        type: choice
        options:
          - major
          - minor
          - patch

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  create-version:
    name: Create Version Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required to fetch all tags

      - name: Get latest root tag
        id: get_tag
        run: |
          # Only root-module tags (vX.Y.Z) count. Submodule tags are prefixed
          # with their directory (aws/v0.30.0, database/redis/v0.30.0, ...), and
          # `git describe` would happily return one of those and derive a
          # nonsense next version from it.
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          LATEST_TAG=${LATEST_TAG:-v0.0.0}
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest root tag: $LATEST_TAG"

      - name: Resolve the release version
        id: next_version
        run: |
          # The version comes from what the modules declare, not from bumping
          # the last tag. Those two disagreed: the modules required v0.30.0
          # while this workflow computed v0.21.0 from the newest root tag, so a
          # release would publish a tag no module referenced.
          #
          # scripts/sync-module-versions.sh sets the declared version; this job
          # only publishes it.
          DECLARED=$(grep -hoE 'github\.com/skolldire/go-engine v[0-9]+\.[0-9]+\.[0-9]+' aws/go.mod | head -n1 | awk '{print $2}')

          if [ -z "$DECLARED" ]; then
            echo "::error::no intra-repository version found in aws/go.mod"
            exit 1
          fi

          LATEST="${{ steps.get_tag.outputs.latest_tag }}"
          if [ "$DECLARED" = "$LATEST" ]; then
            echo "::error::modules already declare the released version $LATEST"
            exit 1
          fi

          echo "new_version=$DECLARED" >> $GITHUB_OUTPUT
          echo "Releasing $DECLARED (previous root tag: $LATEST)"

      - name: Create and push tag
        run: |
          set -e -o pipefail
          NEW_VERSION="${{ steps.next_version.outputs.new_version }}"
          
          # Verify tag doesn't already exist
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag $NEW_VERSION already exists, skipping..."
            exit 0
          fi
          
          # Create annotated tag
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          echo "Created tag: $NEW_VERSION"
          
          # Push tag (this will trigger the release workflow)
          git push origin "$NEW_VERSION"
          echo "Successfully pushed tag: $NEW_VERSION"
